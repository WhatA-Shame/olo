    <style>

      /* 启动占位：纯 CSS，脚本就绪后由 app/shell.ts 淡出移除 */
      #boot {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden;
        font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #eaf0ff;
        background:
          radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 27% 68%, #cfe6ff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 41% 14%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 58% 79%, #ffe7ad 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 73% 31%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 61%, #cfe6ff 50%, transparent 51%),
          radial-gradient(1px 1px at 93% 12%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 6% 84%, #ffe7ad 50%, transparent 51%),
          radial-gradient(120% 85% at 50% 0%, #16264f 0%, #0a1128 48%, #050814 100%);
        transition: opacity 0.45s ease-out;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      .boot__inner { display: flex; flex-direction: column; align-items: center; padding: 16px; text-align: center; }
      .boot__mark { width: min(30vmin, 132px); height: min(30vmin, 132px); filter: drop-shadow(0 0 14px rgba(255, 214, 130, 0.55)); }
      .boot__ring { transform-origin: 60px 62px; animation: boot-ring 3.2s linear infinite; }
      .boot__star { transform-origin: 60px 60px; animation: boot-star 2.4s ease-in-out infinite; }
      .boot__name {
        margin-top: 4px; font-size: clamp(30px, 8.4vmin, 58px); font-weight: 900; line-height: 1.2; letter-spacing: 0.22em; margin-right: -0.22em; color: #f3cf85;
        background: linear-gradient(180deg, #fffbe9 0%, #ffe7ad 34%, #e0b160 62%, #a8742c 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .boot__sub { display: flex; align-items: center; gap: 12px; margin-top: 2px; font-size: clamp(11px, 2.4vmin, 15px); font-weight: 700; letter-spacing: 0.56em; color: #8fe9ff; }
      .boot__sub b { margin-right: -0.56em; }
      .boot__sub i { width: clamp(28px, 9vmin, 64px); height: 1px; background: linear-gradient(90deg, transparent, #e0b160); }
      .boot__sub i:last-child { transform: scaleX(-1); }
      .boot__bar { position: relative; width: min(56vmin, 260px); height: 3px; margin-top: 26px; border-radius: 3px; background: rgba(143, 233, 255, 0.16); overflow: hidden; }
      .boot__bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 38%; border-radius: 3px; background: linear-gradient(90deg, transparent, #8fe9ff 40%, #ffe7ad 70%, transparent); animation: boot-bar 1.25s ease-in-out infinite; }
      .boot__tip { min-height: 1.6em; margin: 12px 0 0; max-width: 30em; font-size: 13px; line-height: 1.6; letter-spacing: 0.08em; color: #7f8fb4; }
      #boot.is-error .boot__bar { display: none; }
      #boot.is-error .boot__tip { color: #ffb4a8; letter-spacing: 0.02em; }
      @keyframes boot-ring { to { transform: rotate(360deg); } }
      @keyframes boot-star { 0%, 100% { transform: scale(0.94); opacity: 0.88; } 50% { transform: scale(1.04); opacity: 1; } }
      @keyframes boot-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { .boot__ring, .boot__star, .boot__bar span { animation-duration: 6s; } }

    <script>
      // 启动看门狗：主脚本接管(置 __mobaBooted)之前出错或迟迟不来，都在占位页上说明，而不是一直转圈
      (function () {
        var boot = document.getElementById('boot');
        var tip = document.getElementById('boot-tip');
        if (!boot || !tip) return;
        function say(text, isError) {
          if (window.__mobaBooted) return;
          tip.textContent = text;
          if (isError) boot.classList.add('is-error');
        }
        window.addEventListener('error', function (ev) {
          say('启动失败：' + ((ev && ev.message) || '脚本未能运行') + '。请刷新页面重试。', true);
        });
        setTimeout(function () {
          say('载入时间比预期长，请稍候…若一直停在这里，请刷新页面或换用新版浏览器。', false);
        }, 15000);
      })();
    </script>
    <script nomodule>
      document.getElementById('boot').classList.add('is-error');
      document.getElementById('boot-tip').textContent = '当前浏览器版本过旧，无法运行游戏。请更新浏览器后再试。';
    </script>

    <script id="sf-community-plugin">
      (function () {
        var PAGE_KEY = 'xingyun-moba';
        var COMMENTS_API = '/api/comments';

        var TRACK_API = '/api/track';
        var VERCOUNT_API = 'https://events.vercount.one/api/v2/log';
        var NICK_STORE = 'starfall.nickname.v1';
        var UV_STORE = 'starfall.uv.v1';
        var STATS_CACHE_STORE = 'starfall.stats.cache.v1';
        var LIMIT = 10;

        var isBot = !!(navigator.webdriver || /bot|crawl|spider|curl|wget/i.test(navigator.userAgent || ''));
        var host = (location.hostname || '').toLowerCase();
        var isProdHost = host === 'sanwan.ai' || host === 'sanwan.online' || /\.sanwan\.(ai|online)$/.test(host);
        var counterUrl = isProdHost ? 'https://xingyun-moba.sanwan.ai/' : 'https://xingyun-moba-dev.sanwan.ai/';

        var state = {
          uv: null,
          pv: null,
          totalComments: null,
          initialList: null,
          adminToken: ''
        };

        function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function playUi(kind) {
          try { if (window.__moba && window.__moba.audio) window.__moba.audio.ui(kind); } catch (e) {}
        }
        function fmtNum(n) {
          return typeof n === 'number' && isFinite(n) ? n.toLocaleString('zh-CN') : '—';
        }
        function esc(s) {
          var d = document.createElement('div');
          d.textContent = s == null ? '' : String(s);
          return d.innerHTML;
        }
        function avatarColor(name) {
          var palette = ['#8e5ce8', '#3b82f6', '#d97706', '#0ea5e9', '#10b981', '#ec4899', '#c2410c'];
          var str = String(name || '星');
          var h = 0;
          for (var i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
          return palette[Math.abs(h) % palette.length];
        }

        // 读取上次缓存的访客数，避免首屏闪烁
        try {
          var cached = JSON.parse(safeGet(STATS_CACHE_STORE) || 'null');
          if (cached && typeof cached === 'object') {
            if (typeof cached.uv === 'number') state.uv = cached.uv;
            if (typeof cached.pv === 'number') state.pv = cached.pv;
          }
        } catch (e) {}

        var statsSubscribers = new Set();
        function notifyStats() {
          statsSubscribers.forEach(function (fn) { try { fn(); } catch (e) {} });
        }

        // 1) 上报官网统计 + 拉取/递增《星陨战纪》专属访客人数（国内外两站共用同一 canonical key）
        function initAnalyticsAndCounter() {
          if (isProdHost && !isBot) {
            try {
              var sid = sessionStorage.getItem('_sw_sid');
              if (!sid) { sid = Math.random().toString(36).slice(2, 11); sessionStorage.setItem('_sw_sid', sid); }
              fetch(TRACK_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ p: location.pathname, r: document.referrer, s: sid, w: screen.width, t: Date.now() }),
                keepalive: true
              }).catch(function () {});
            } catch (e) {}
          }

          var uvKey = UV_STORE + ':' + (isProdHost ? 'prod' : 'dev');
          var isNewUv = !isBot && safeGet(uvKey) !== '1';
          if (isNewUv) safeSet(uvKey, '1');

          var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 6000) : 0;
          fetch(VERCOUNT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: counterUrl, isNewUv: isNewUv }),
            signal: ctrl ? ctrl.signal : undefined
          })
            .then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; })
            .then(function (j) {
              var d = j && j.data ? j.data : j;
              if (!d) return;
              var pv = Number(d.page_pv != null ? d.page_pv : d.site_pv);
              var uv = Number(d.site_uv);
              if (isFinite(pv) && pv >= 0) state.pv = pv;
              if (isFinite(uv) && uv >= 0) state.uv = Math.max(uv, pv > 0 ? 1 : 0);
              safeSet(STATS_CACHE_STORE, JSON.stringify({ uv: state.uv, pv: state.pv }));
              notifyStats();
            })
            .catch(function () { clearTimeout(timer); });

          // 预取第一页留言数量，让主菜单直接显示当前留言条数
          if (location.protocol === 'http:' || location.protocol === 'https:') {
            fetch(COMMENTS_API + '?page=' + PAGE_KEY + '&limit=' + LIMIT + '&offset=0')
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                if (j && Array.isArray(j.data)) {
                  state.totalComments = Number(j.total) || j.data.length;
                  state.initialList = j.data;
                  notifyStats();
                }
              })
              .catch(function () {});
          }
        }

        var CHAT_ICON = '<svg class="sf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-4.2 3.4c-.5.4-1.2 0-1.2-.6V16A2.5 2.5 0 0 1 4 14.5z"/><path d="M12 6.8l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="currentColor" stroke="none"/></svg>';
        var CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        var STAR_ICON = '<svg class="sf-home__stats-star" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0.6Q8.8 7.2 15.4 8Q8.8 8.8 8 15.4Q7.2 8.8 0.6 8Q7.2 7.2 8 0.6Z" fill="currentColor"/></svg>';

        function extractMatchTag(resultEl) {
          if (!resultEl) return '';
          try {
            var win = resultEl.classList.contains('sf-result--win');
            var meRow = resultEl.querySelector('.sf-rt__row.is-me');
            if (!meRow) return '';
            var nameEl = meRow.querySelector('.sf-rt__name');
            var hero = '';
            if (nameEl) {
              var mainName = nameEl.querySelector('b, .sf-heroname__name') || nameEl.firstElementChild || nameEl;
              hero = (mainName.textContent || '').trim();
            }
            var kdaEl = meRow.querySelector('.sf-rt__kda');
            var kda = kdaEl ? (kdaEl.textContent || '').replace(/\s+/g, '') : '';
            var mvp = meRow.classList.contains('is-mvp') ? ' MVP' : '';
            if (!hero && !kda) return '';
            return '【' + (win ? '胜利' : '对局') + (hero ? ' · ' + hero : '') + (kda ? ' ' + kda : '') + mvp + '】';
          } catch (e) { return ''; }
        }

        // 2) 打开星陨原生风格留言板弹窗
        var activeClose = null;
        function openGuestbook(rootEl, matchTag) {
          if (!rootEl) return;
          if (activeClose) { activeClose(); }

          var curOffset = 0;
          var curTotal = state.totalComments || 0;
          var replyTargets = {};
          var pendingDeleteId = null;

          var scrim = document.createElement('div');
          scrim.className = 'sf-dialog-scrim sf-gb-scrim';

          var dialog = document.createElement('div');
          dialog.className = 'sf-dialog sf-panel sf-dialog--gb';
          dialog.setAttribute('role', 'dialog');
          dialog.setAttribute('aria-modal', 'true');
          dialog.setAttribute('aria-label', '星陨留言板');
          dialog.tabIndex = -1;

          var head = document.createElement('div');
          head.className = 'sf-dialog__head';
          var title = document.createElement('h2');
          title.className = 'sf-dialog__title sf-metal';
          title.textContent = '星陨留言板';
          var headMeta = document.createElement('span');
          headMeta.className = 'sf-gb__head-meta';
          var closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'sf-iconbtn sf-iconbtn--quiet';
          closeBtn.setAttribute('aria-label', '关闭');
          closeBtn.dataset.sfSnd = 'back';
          closeBtn.innerHTML = '<span class="sf-i">' + CLOSE_ICON + '</span>';
          head.append(title, headMeta, closeBtn);

          var body = document.createElement('div');
          body.className = 'sf-dialog__body sf-scroll';

          var wrap = document.createElement('div');
          wrap.className = 'sf-gb';
          wrap.innerHTML =
            '<div class="sf-gb__compose">' +
              '<div class="sf-gb__compose-top">' +
                '<input class="sf-gb__input" id="sfGbNick" maxlength="20" placeholder="召唤师昵称（选填）" />' +
                (matchTag ? '<button type="button" class="sf-gb__match-chip" id="sfGbMatchChip" data-sf-snd="click">+ 附上战绩 ' + esc(matchTag) + '</button>' : '') +
              '</div>' +
              '<textarea class="sf-gb__textarea" id="sfGbContent" maxlength="500" rows="2" placeholder="聊聊你的本命英雄、连招出装心得，或提点新英雄/玩法建议…（Ctrl+Enter 发送）"></textarea>' +
              '<div class="sf-gb__compose-foot">' +
                '<span class="sf-gb__status" id="sfGbStatus">0 / 500</span>' +
                '<button type="button" class="sf-btn sf-btn--primary sf-gb__submit" id="sfGbSubmit" data-sf-snd="click"><span class="sf-btn__label">发布留言</span></button>' +
              '</div>' +
            '</div>' +
            '<div class="sf-gb__list" id="sfGbList"><div class="sf-gb__empty">正在载入召唤师留言…</div></div>' +
            '<div class="sf-gb__pager sf-hidden" id="sfGbPager">' +
              '<button type="button" class="sf-gb__mini-btn" id="sfGbPrev" data-sf-snd="click">← 上一页</button>' +
              '<span class="sf-gb__pager-info" id="sfGbPageInfo"></span>' +
              '<button type="button" class="sf-gb__mini-btn" id="sfGbNext" data-sf-snd="click">下一页 →</button>' +
            '</div>' +
            '<div class="sf-gb__admin" id="sfGbAdmin">' +
              '<span class="sf-gb__admin-toggle" id="sfGbAdminToggle">管理</span>' +
            '</div>';

          body.appendChild(wrap);
          dialog.append(head, body);
          scrim.appendChild(dialog);
          rootEl.appendChild(scrim);

          var nickInput = wrap.querySelector('#sfGbNick');
          var contentInput = wrap.querySelector('#sfGbContent');
          var statusEl = wrap.querySelector('#sfGbStatus');
          var submitBtn = wrap.querySelector('#sfGbSubmit');
          var listEl = wrap.querySelector('#sfGbList');
          var pagerEl = wrap.querySelector('#sfGbPager');
          var prevBtn = wrap.querySelector('#sfGbPrev');
          var nextBtn = wrap.querySelector('#sfGbNext');
          var pageInfoEl = wrap.querySelector('#sfGbPageInfo');
          var adminEl = wrap.querySelector('#sfGbAdmin');
          var matchChip = wrap.querySelector('#sfGbMatchChip');

          nickInput.value = safeGet(NICK_STORE) || '';

          function updateHeadMeta() {
            var parts = [];
            if (state.uv != null) parts.push('访客<b>' + fmtNum(state.uv) + '</b>人');
            if (state.pv != null) parts.push('访问<b>' + fmtNum(state.pv) + '</b>次');
            if (state.totalComments != null) parts.push('留言<b>' + fmtNum(state.totalComments) + '</b>条');
            headMeta.innerHTML = parts.join(' · ');
          }
          updateHeadMeta();
          statsSubscribers.add(updateHeadMeta);

          function setStatus(msg, tone) {
            statusEl.textContent = msg;
            statusEl.className = 'sf-gb__status' + (tone ? ' is-' + tone : '');
          }
          contentInput.addEventListener('input', function () {
            setStatus(contentInput.value.length + ' / 500', '');
          });

          if (matchChip && matchTag) {
            matchChip.addEventListener('click', function () {
              if (contentInput.value.indexOf(matchTag) === -1) {
                contentInput.value = matchTag + (contentInput.value ? ' ' + contentInput.value : ' ');
                contentInput.dispatchEvent(new Event('input'));
              }
              matchChip.classList.add('is-used');
              contentInput.focus();
            });
          }

          function officialBadge(item) {
            return item && item.is_official === 1 ? '<span class="sf-gb__badge-official">官方</span>' : '';
          }

          function renderReply(r, mainId, byId) {
            var nick = r.nickname || '星陨召唤师';
            var loc = r.location ? '<span class="sf-gb__loc">· ' + esc(r.location) + '</span>' : '';
            var tgt = r.reply_to_id && r.reply_to_id !== mainId ? byId[r.reply_to_id] : null;
            var quote = '';
            if (tgt) {
              var qText = String(tgt.content || '');
              quote = '<div class="sf-gb__quote">回复 <b>@' + esc(tgt.nickname || '星陨召唤师') + '</b>：' +
                esc(qText.slice(0, 44)) + (qText.length > 44 ? '…' : '') + '</div>';
            }
            return '<div class="sf-gb__reply' + (r.is_official === 1 ? ' is-official' : '') + '">' +
              '<div class="sf-gb__card-head">' +
                '<span class="sf-gb__author"><span class="sf-gb__nick">' + esc(nick) + '</span>' + officialBadge(r) + loc + '</span>' +
                '<span class="sf-gb__time">' + esc(r.created_at || '') + '</span>' +
              '</div>' +
              quote +
              '<p class="sf-gb__content">' + esc(r.content || '') + '</p>' +
              '<div class="sf-gb__actions">' +
                '<button type="button" class="sf-gb__linkbtn" data-act="reply" data-main="' + mainId + '" data-rid="' + r.id + '" data-nick="' + esc(nick) + '">回复</button>' +
              '</div>' +
            '</div>';
          }

          function renderCard(c) {
            var nick = c.nickname || '星陨召唤师';
            var initial = Array.from(nick.trim())[0] || '星';
            var loc = c.location ? '<span class="sf-gb__loc">· ' + esc(c.location) + '</span>' : '';
            var byId = {};
            byId[c.id] = c;
            var repliesArr = Array.isArray(c.replies) ? c.replies : [];
            repliesArr.forEach(function (r) { byId[r.id] = r; });
            var repliesHtml = repliesArr.length
              ? '<div class="sf-gb__replies">' + repliesArr.map(function (r) { return renderReply(r, c.id, byId); }).join('') + '</div>'
              : '';
            var delLabel = pendingDeleteId === c.id ? '确认删除？' : '删除';
            var adminBtn = state.adminToken
              ? '<button type="button" class="sf-gb__linkbtn is-danger" data-act="delete" data-id="' + c.id + '">' + delLabel + '</button>'
              : '';
            return '<div class="sf-gb__card" data-cid="' + c.id + '">' +
              '<div class="sf-gb__card-head">' +
                '<span class="sf-gb__author">' +
                  '<span class="sf-gb__avatar" style="background:' + avatarColor(nick) + '">' + esc(initial) + '</span>' +
                  '<span class="sf-gb__nick">' + esc(nick) + '</span>' +
                  officialBadge(c) + loc +
                '</span>' +
                '<span class="sf-gb__time">' + esc(c.created_at || '') + '</span>' +
              '</div>' +
              '<p class="sf-gb__content">' + esc(c.content || '') + '</p>' +
              '<div class="sf-gb__actions">' +
                '<button type="button" class="sf-gb__linkbtn" data-act="reply" data-main="' + c.id + '">💬 回复</button>' +
                adminBtn +
              '</div>' +
              repliesHtml +
              '<div class="sf-gb__replybox sf-hidden" id="sfGbRb-' + c.id + '">' +
                '<div class="sf-gb__replybox-row">' +
                  '<input class="sf-gb__input" id="sfGbRn-' + c.id + '" maxlength="20" placeholder="昵称（选填）" value="' + esc(safeGet(NICK_STORE) || '') + '" />' +
                  '<textarea class="sf-gb__textarea" id="sfGbRc-' + c.id + '" maxlength="300" rows="1" placeholder="写下你的回复…"></textarea>' +
                '</div>' +
                '<div class="sf-gb__replybox-btns">' +
                  '<button type="button" class="sf-gb__mini-btn" data-act="cancel-reply" data-main="' + c.id + '">取消</button>' +
                  '<button type="button" class="sf-gb__mini-btn is-primary" data-act="send-reply" data-main="' + c.id + '">发送回复</button>' +
                '</div>' +
              '</div>' +
            '</div>';
          }

          function renderList(items, total) {
            curTotal = typeof total === 'number' ? total : (items ? items.length : 0);
            state.totalComments = curTotal;
            notifyStats();
            if (!items || !items.length) {
              listEl.innerHTML = '<div class="sf-gb__empty">还没有召唤师留言，来抢下第一滴血（沙发）吧！</div>';
              pagerEl.classList.add('sf-hidden');
              return;
            }
            listEl.innerHTML = items.map(renderCard).join('');
            var totalPages = Math.max(1, Math.ceil(curTotal / LIMIT));
            var curPage = Math.floor(curOffset / LIMIT) + 1;
            pagerEl.classList.toggle('sf-hidden', curTotal <= LIMIT);
            pageInfoEl.textContent = '第 ' + curPage + ' / ' + totalPages + ' 页（共 ' + curTotal + ' 条）';
            prevBtn.disabled = curOffset <= 0;
            nextBtn.disabled = curOffset + LIMIT >= curTotal;
          }

          function loadComments() {
            if (location.protocol !== 'http:' && location.protocol !== 'https:') {
              listEl.innerHTML = '<div class="sf-gb__empty">当前为本地离线文件打开，部署至 sanwan.ai / sanwan.online 后即可查看与发布线上留言。</div>';
              return;
            }
            fetch(COMMENTS_API + '?page=' + PAGE_KEY + '&limit=' + LIMIT + '&offset=' + curOffset)
              .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
              })
              .then(function (j) {
                if (curOffset === 0 && Array.isArray(j.data)) state.initialList = j.data;
                renderList(j.data || [], Number(j.total) || 0);
              })
              .catch(function () {
                listEl.innerHTML = isProdHost
                  ? '<div class="sf-gb__empty">留言加载失败，请稍后重试。</div>'
                  : '<div class="sf-gb__empty">本地预览未连接线上留言服务，发布到 sanwan.ai / sanwan.online 后自动生效。</div>';
              });
          }

          function submitMainComment() {
            var nick = nickInput.value.trim();
            var ct = contentInput.value.trim();
            if (!ct) {
              playUi('error');
              setStatus('请先写点内容再发布吧', 'err');
              contentInput.focus();
              return;
            }
            if (nick) safeSet(NICK_STORE, nick);
            submitBtn.disabled = true;
            submitBtn.querySelector('.sf-btn__label').textContent = '发送中…';
            fetch(COMMENTS_API, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                page: PAGE_KEY,
                name: nick || '星陨召唤师',
                nickname: nick || '星陨召唤师',
                content: ct
              })
            })
              .then(function (r) { return r.json(); })
              .then(function (j) {
                submitBtn.disabled = false;
                submitBtn.querySelector('.sf-btn__label').textContent = '发布留言';
                if (j && !j.error) {
                  playUi('confirm');
                  contentInput.value = '';
                  setStatus('留言发布成功！', 'ok');
                  curOffset = 0;
                  loadComments();
                } else {
                  playUi('error');
                  setStatus((j && j.error) || '发送失败，请稍后再试', 'err');
                }
              })
              .catch(function () {
                submitBtn.disabled = false;
                submitBtn.querySelector('.sf-btn__label').textContent = '发布留言';
                playUi('error');
                setStatus(isProdHost ? '网络异常，请重试' : '本地预览环境暂不支持提交线上留言', 'err');
              });
          }

          submitBtn.addEventListener('click', submitMainComment);
          contentInput.addEventListener('keydown', function (ev) {
            if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
              ev.preventDefault();
              submitMainComment();
            }
          });

          listEl.addEventListener('click', function (ev) {
            var btn = ev.target && ev.target.closest ? ev.target.closest('button[data-act]') : null;
            if (!btn) return;
            var act = btn.getAttribute('data-act');
            if (act === 'reply') {
              playUi('click');
              var mainId = Number(btn.getAttribute('data-main'));
              var rid = btn.getAttribute('data-rid') ? Number(btn.getAttribute('data-rid')) : null;
              var rnick = btn.getAttribute('data-nick') || '';
              listEl.querySelectorAll('.sf-gb__replybox').forEach(function (el) { el.classList.add('sf-hidden'); });
              replyTargets[mainId] = rid;
              var rb = listEl.querySelector('#sfGbRb-' + mainId);
              var ta = listEl.querySelector('#sfGbRc-' + mainId);
              if (rb && ta) {
                rb.classList.remove('sf-hidden');
                ta.placeholder = rid ? '回复 @' + rnick + '…' : '写下你的回复…';
                ta.focus();
              }
            } else if (act === 'cancel-reply') {
              playUi('back');
              var cid = Number(btn.getAttribute('data-main'));
              replyTargets[cid] = null;
              var rbCancel = listEl.querySelector('#sfGbRb-' + cid);
              if (rbCancel) rbCancel.classList.add('sf-hidden');
            } else if (act === 'send-reply') {
              var pid = Number(btn.getAttribute('data-main'));
              var rnEl = listEl.querySelector('#sfGbRn-' + pid);
              var rcEl = listEl.querySelector('#sfGbRc-' + pid);
              var rNick = rnEl ? rnEl.value.trim() : '';
              var rContent = rcEl ? rcEl.value.trim() : '';
              if (!rContent) {
                playUi('error');
                if (rcEl) rcEl.focus();
                return;
              }
              if (rNick) safeSet(NICK_STORE, rNick);
              btn.disabled = true;
              btn.textContent = '发送中…';
              fetch(COMMENTS_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  page: PAGE_KEY,
                  name: rNick || '星陨召唤师',
                  nickname: rNick || '星陨召唤师',
                  content: rContent,
                  parent_id: pid,
                  reply_to_id: replyTargets[pid] || null
                })
              })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                  btn.disabled = false;
                  btn.textContent = '发送回复';
                  if (j && !j.error) {
                    playUi('confirm');
                    loadComments();
                  } else {
                    playUi('error');
                    setStatus((j && j.error) || '回复失败', 'err');
                  }
                })
                .catch(function () {
                  btn.disabled = false;
                  btn.textContent = '发送回复';
                  playUi('error');
                  setStatus('网络异常，回复未发出', 'err');
                });
            } else if (act === 'delete') {
              var delId = Number(btn.getAttribute('data-id'));
              if (pendingDeleteId !== delId) {
                pendingDeleteId = delId;
                btn.textContent = '确认删除？';
                playUi('click');
                return;
              }
              pendingDeleteId = null;
              fetch(ADMIN_DELETE_API + delId, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + state.adminToken }
              })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                  if (j && j.ok) {
                    playUi('confirm');
                    curOffset = 0;
                    loadComments();
                  } else {
                    playUi('error');
                    setStatus((j && j.error) || '删除失败（请检查管理令牌）', 'err');
                  }
                })
                .catch(function () {
                  playUi('error');
                  setStatus('删除请求失败', 'err');
                });
            }
          });

          prevBtn.addEventListener('click', function () {
            curOffset = Math.max(0, curOffset - LIMIT);
            loadComments();
            body.scrollTo({ top: 0, behavior: 'smooth' });
          });
          nextBtn.addEventListener('click', function () {
            curOffset += LIMIT;
            loadComments();
            body.scrollTo({ top: 0, behavior: 'smooth' });
          });

          function renderAdminBar() {
            if (state.adminToken) {
              adminEl.innerHTML = '<span style="color:#ff9d8a;font-weight:700">管理模式已开启</span>' +
                '<button type="button" class="sf-gb__linkbtn" id="sfGbAdminExit">退出</button>';
              adminEl.querySelector('#sfGbAdminExit').addEventListener('click', function () {
                state.adminToken = '';
                renderAdminBar();
                loadComments();
              });
            } else {
              adminEl.innerHTML = '<span class="sf-gb__admin-toggle" id="sfGbAdminToggle">管理</span>';
              adminEl.querySelector('#sfGbAdminToggle').addEventListener('click', function () {
                adminEl.innerHTML =
                  '<input type="password" class="sf-gb__input" id="sfGbAdminInput" placeholder="Admin Token" style="width:150px;padding:3px 8px;font-size:11px" />' +
                  '<button type="button" class="sf-gb__mini-btn is-primary" id="sfGbAdminOk">确定</button>' +
                  '<button type="button" class="sf-gb__mini-btn" id="sfGbAdminCancel">取消</button>';
                var inp = adminEl.querySelector('#sfGbAdminInput');
                inp.focus();
                adminEl.querySelector('#sfGbAdminOk').addEventListener('click', function () {
                  var v = inp.value.trim();
                  if (v) { state.adminToken = v; renderAdminBar(); loadComments(); }
                });
                adminEl.querySelector('#sfGbAdminCancel').addEventListener('click', renderAdminBar);
              });
            }
          }
          renderAdminBar();

          if (state.initialList) renderList(state.initialList, state.totalComments || state.initialList.length);
          loadComments();

          // 键盘与焦点隔离：阻止 Enter / Space 冒泡到标题页或结算页的全局开局快捷键
          var closed = false;
          function closeDialog() {
            if (closed) return;
            closed = true;
            if (activeClose === closeDialog) activeClose = null;
            statsSubscribers.delete(updateHeadMeta);
            window.removeEventListener('keydown', onKeyCapture, true);
            scrim.classList.add('is-leaving');
            setTimeout(function () { scrim.remove(); }, 180);
          }
          activeClose = closeDialog;

          function onKeyCapture(ev) {
            if (!scrim.isConnected) { closeDialog(); return; }
            if (ev.key === 'Escape') {
              ev.stopImmediatePropagation();
              ev.preventDefault();
              playUi('back');
              closeDialog();
              return;
            }
            if (!(ev.target instanceof Node && scrim.contains(ev.target))) {
              ev.stopImmediatePropagation();
            }
          }
          window.addEventListener('keydown', onKeyCapture, true);
          scrim.addEventListener('keydown', function (ev) { ev.stopPropagation(); });
          scrim.addEventListener('keyup', function (ev) { ev.stopPropagation(); });
          scrim.addEventListener('pointerdown', function (ev) {
            if (ev.target === scrim) { playUi('back'); closeDialog(); }
          });
          closeBtn.addEventListener('click', closeDialog);
          dialog.focus({ preventScroll: true });
        }

        // 3) 挂载到主菜单与结算界面（仅监听界面切换，对局中零开销）
        function createMenuButton(onClick) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sf-btn sf-btn--gb-entry';
          btn.dataset.sfSnd = 'click';
          btn.innerHTML = '<span class="sf-i">' + CHAT_ICON + '</span>' +
            '<span class="sf-btn__label">留言板</span>' +
            '<span class="sf-gb-pill"></span>';
          var pill = btn.querySelector('.sf-gb-pill');
          function syncPill() {
            if (!btn.isConnected) { statsSubscribers.delete(syncPill); return; }
            pill.textContent = state.totalComments && state.totalComments > 0 ? String(state.totalComments) : '';
          }
          syncPill();
          statsSubscribers.add(syncPill);
          btn.addEventListener('click', onClick);
          return btn;
        }

        function enhanceHome(homeEl) {
          if (!homeEl || homeEl.dataset.sfGbEnhanced === '1') return;
          homeEl.dataset.sfGbEnhanced = '1';
          var rootEl = homeEl.closest('.sf-root') || homeEl.parentElement;
          var menuEl = homeEl.querySelector('.sf-home__menu');
          var rowEl = homeEl.querySelector('.sf-home__row');
          if (menuEl && rowEl) {
            menuEl.classList.add('has-gb');
            rowEl.classList.add('has-gb');
            var gbBtn = createMenuButton(function () { openGuestbook(rootEl, ''); });
            // 桌面/横屏放在「操作说明」与「设置」中间；窄竖屏自动占满第二行
            if (rowEl.children.length >= 2) rowEl.insertBefore(gbBtn, rowEl.children[1]);
            else rowEl.appendChild(gbBtn);
          }

          var statsBar = document.createElement('button');
          statsBar.type = 'button';
          statsBar.className = 'sf-home__stats';
          statsBar.dataset.sfSnd = 'click';
          statsBar.setAttribute('aria-label', '查看访问统计与玩家留言');
          function syncStatsBar() {
            if (!statsBar.isConnected) { statsSubscribers.delete(syncStatsBar); return; }
            var uvTxt = state.uv != null ? fmtNum(state.uv) : '…';
            var pvTxt = state.pv != null ? fmtNum(state.pv) : '…';
            var cmtPart = state.totalComments != null
              ? '<span class="sf-home__stats-dot"></span><span class="sf-home__stats-item">玩家留言 <b>' + fmtNum(state.totalComments) + '</b> 条</span>'
              : '';
            statsBar.innerHTML = STAR_ICON +
              '<span class="sf-home__stats-item">已有 <b>' + uvTxt + '</b> 位召唤师来战</span>' +
              '<span class="sf-home__stats-dot"></span>' +
              '<span class="sf-home__stats-item">累计访问 <b>' + pvTxt + '</b> 次</span>' +
              cmtPart;
          }
          syncStatsBar();
          statsSubscribers.add(syncStatsBar);
          statsBar.addEventListener('click', function () { openGuestbook(rootEl, ''); });

          var footEl = homeEl.querySelector('.sf-home__foot');
          if (footEl) homeEl.insertBefore(statsBar, footEl);
          else homeEl.appendChild(statsBar);
        }

        function enhanceResult(resultEl) {
          if (!resultEl || resultEl.dataset.sfGbEnhanced === '1') return;
          resultEl.dataset.sfGbEnhanced = '1';
          var rootEl = resultEl.closest('.sf-root') || resultEl.parentElement;
          var actionsEl = resultEl.querySelector('.sf-result__actions');
          if (!actionsEl) return;
          actionsEl.classList.add('has-gb');
          var gbBtn = createMenuButton(function () {
            openGuestbook(rootEl, extractMatchTag(resultEl));
          });
          if (actionsEl.lastElementChild) actionsEl.insertBefore(gbBtn, actionsEl.lastElementChild);
          else actionsEl.appendChild(gbBtn);
        }

        function scanScreens() {
          var app = document.getElementById('app');
          if (!app) return;
          var home = app.querySelector('.sf-home');
          if (home) enhanceHome(home);
          var result = app.querySelector('.sf-result');
          if (result) enhanceResult(result);
        }

        function bootPlugin() {
          initAnalyticsAndCounter();
          scanScreens();
          var app = document.getElementById('app');
          if (app && typeof MutationObserver === 'function') {
            var obs = new MutationObserver(function (mutations) {
              for (var i = 0; i < mutations.length; i++) {
                if (mutations[i].addedNodes && mutations[i].addedNodes.length > 0) {
                  scanScreens();
                  break;
                }
              }
            });
            obs.observe(app, { childList: true, subtree: true });
          }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootPlugin);
        else bootPlugin();
      })();
    </script>
